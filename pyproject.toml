[project]
name = "funnelscript"
version = "0.1.0"
description = "Declarative DSL and Stochastic Agent-Based Simulation Runtime for Marketing Systems Engineering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
funnelscript = "funnelscript.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
