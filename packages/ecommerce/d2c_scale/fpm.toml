[package]
name = "ecommerce/d2c_scale"
version = "0.1.0"
description = "Flagship FunnelScript D2C scale strategy with dual Prepaid & COD payment channels and liquidity stress testing"
author = "FunnelScript Core Team <core@funnelscript.org>"
license = "MIT"
funnelscript_version = ">=0.4.0"
main = "index.fnls"

[modules]
acquisition = "acquisition.fnls"
fulfillment = "fulfillment.fnls"
treasury = "treasury.fnls"
entities = "entities.fnls"
index = "index.fnls"

[dependencies]
"core/commerce_traits" = ">=0.1.0"

[parameters.ad_spend_daily]
type = "float"
dimension = "Currency"
unit = "USD"
default = 5000.0
min = 100.0
max = 500000.0
description = "Target daily paid advertising budget across channels"

[parameters.hill_k]
type = "float"
dimension = "Currency"
unit = "USD"
default = 12000.0
min = 1000.0
max = 1000000.0
description = "Hill saturation half-max daily spend parameter"

[parameters.hill_alpha]
type = "float"
dimension = "Scalar"
default = 0.85
min = 0.10
max = 2.50
description = "Hill curvature parameter controlling marginal return decay"

[parameters.adstock_decay]
type = "float"
dimension = "Ratio"
default = 0.40
min = 0.00
max = 0.95
description = "Geometric adstock retention carryover rate per day"

[parameters.order_value]
type = "float"
dimension = "Currency"
unit = "USD"
default = 85.0
min = 5.0
max = 5000.0
description = "Average order value (AOV) per transaction"

[parameters.cogs_rate]
type = "float"
dimension = "Ratio"
default = 0.35
min = 0.05
max = 0.90
description = "Cost of goods sold as percentage of order value"

[parameters.cod_share_rate]
type = "float"
dimension = "Ratio"
default = 0.65
min = 0.00
max = 1.00
description = "Proportion of orders selecting Cash on Delivery"

[parameters.cod_confirmation_rate]
type = "float"
dimension = "Ratio"
default = 0.88
min = 0.10
max = 1.00
description = "Rate at which COD orders are successfully confirmed before dispatch"

[parameters.cod_rto_rate]
type = "float"
dimension = "Ratio"
default = 0.18
min = 0.00
max = 0.80
description = "Return-to-Origin rate for shipped COD orders"

[parameters.forward_shipping_cost]
type = "float"
dimension = "Currency"
unit = "USD"
default = 4.50
min = 0.00
max = 100.0
description = "Courier forward delivery fee paid per dispatched parcel"

[parameters.return_shipping_cost]
type = "float"
dimension = "Currency"
unit = "USD"
default = 3.50
min = 0.00
max = 100.0
description = "Reverse logistics return fee paid per RTO parcel"

[parameters.delivery_delay_days]
type = "int"
dimension = "Duration"
unit = "days"
default = 4
min = 1
max = 30
description = "Average transit duration from dispatch to delivery attempt"

[parameters.gateway_fee_rate]
type = "float"
dimension = "Ratio"
default = 0.029
min = 0.00
max = 0.15
description = "Credit card / payment gateway processing fee"

[parameters.gateway_settle_days]
type = "int"
dimension = "Duration"
unit = "days"
default = 3
min = 1
max = 30
description = "Gateway payout latency to merchant bank account"

[parameters.rolling_reserve_rate]
type = "float"
dimension = "Ratio"
default = 0.05
min = 0.00
max = 0.30
description = "Gateway risk rolling reserve percentage held back"

[parameters.cod_fee_rate]
type = "float"
dimension = "Ratio"
default = 0.020
min = 0.00
max = 0.15
description = "Courier cash collection fee on delivered COD orders"

[parameters.cod_remittance_days]
type = "int"
dimension = "Duration"
unit = "days"
default = 7
min = 1
max = 60
description = "Courier cash settlement delay after successful delivery"

[parameters.initial_cash]
type = "float"
dimension = "Currency"
unit = "USD"
default = 15000.0
min = 0.0
max = 10000000.0
description = "Available liquid bank cash at start of simulation"

[parameters.min_safety_cash]
type = "float"
dimension = "Currency"
unit = "USD"
default = 5000.0
min = 0.0
max = 10000000.0
description = "Minimum cash reserve threshold before raising insolvency alert"

[metrics.accrual_gmv]
dimension = "Currency"
unit = "USD"
description = "Total booked gross merchandise value"

[metrics.settled_cash]
dimension = "Currency"
unit = "USD"
description = "Net realized liquid cash deposited in bank account"

[metrics.net_mer]
dimension = "Ratio"
description = "Realized Marketing Efficiency Ratio (Settled Cash / Paid Ad Spend)"

[metrics.paper_roas]
dimension = "Ratio"
description = "Nominal platform ROAS (Booked GMV / Paid Ad Spend)"

[metrics.min_cash_trough]
dimension = "Currency"
unit = "USD"
description = "Minimum liquid cash balance observed during simulation horizon"

[metrics.cash_runway_breached]
dimension = "Boolean"
description = "True if cash balance breached min_safety_cash floor"
